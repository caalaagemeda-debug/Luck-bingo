<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#020718;
    color:white;
    min-height:100vh;
}

/* HEADER */

.header{
    height:70px;
    background:#17212b;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:25px;
    font-weight:bold;
}

.close{
    font-size:38px;
    margin-right:35px;
    font-weight:300;
}

.header-title{
    flex:1;
}

.header-icons{
    display:flex;
    gap:25px;
    font-size:30px;
}


/* ACCOUNT AREA */

.account{
    height:138px;
    padding:30px;
    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #10172b;
}

.avatar{
    width:72px;
    height:72px;
    border-radius:25px;
    background:#f1f4fa;
    color:#182033;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
}

.balances{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.balance{
    min-width:210px;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #263451;
    background:#10182d;
    font-weight:bold;
}

.balance:first-child{
    color:#22d8ef;
}

.balance:last-child{
    color:#ffd400;
}


/* MAIN */

.container{
    max-width:700px;
    margin:auto;
    padding:30px 20px 100px;
}


/* WAITING MESSAGE */

.waiting{
    background:#080f21;
    border:1px solid #151e34;
    border-radius:22px;
    padding:20px;
    margin-bottom:30px;
}

.waiting-title{
    color:#7d879e;
    font-size:17px;
}

.waiting-text{
    font-size:20px;
    margin-top:7px;
}


/* GAME PANEL */

.game-panel{
    border:2px solid #c99a18;
    border-radius:30px;
    padding:18px;
    margin-bottom:25px;
    background:#101829;
}

.game-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.jackpot{
    font-size:40px;
    font-weight:900;
}

.label{
    color:#ffd000;
    background:#262718;
    padding:5px 15px;
    border-radius:8px;
    display:inline-block;
    margin-bottom:10px;
}

.timer{
    text-align:right;
}

.timer-title{
    color:#9ba5bb;
    font-size:14px;
}

.timer-number{
    font-size:45px;
    font-weight:bold;
}


/* CALLED BALLS */

.called{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:15px;
}

.ball{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#f8c52b;
    color:#26303c;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    box-shadow:0 0 15px rgba(255,196,30,.6);
}

.ball small{
    font-size:10px;
}


/* NUMBER SELECTOR */

.selector{
    background:#0b1325;
    border:1px solid #293348;
    border-radius:25px;
    overflow:hidden;
}

.selector-header{
    padding:22px;
    font-size:21px;
    font-weight:bold;
    border-bottom:1px solid #293348;
    display:flex;
    justify-content:space-between;
}

.selected-display{
    color:#ffd000;
}

.number-grid{
    padding:15px;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:5px;
    max-height:500px;
    overflow-y:auto;
}

.number{
    height:45px;
    border:1px solid #293347;
    border-radius:9px;
    background:#151c2b;
    color:#8290a8;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
    transition:.15s;
}

.number:hover{
    background:#222c40;
    color:white;
}

.number.selected{
    background:#ffd000;
    color:#101827;
    border-color:#ffd000;
    box-shadow:0 0 15px rgba(255,208,0,.4);
}


/* START STATUS */

.status{
    text-align:center;
    padding:20px;
}

.status-text{
    color:#8995aa;
    margin-bottom:10px;
}

.start-button{
    border:none;
    padding:14px 35px;
    border-radius:12px;
    background:#ffd000;
    color:#111827;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.start-button:disabled{
    opacity:.4;
    cursor:not-allowed;
}


/* GAME CARD */

.bingo-card{
    display:none;
    margin-top:25px;
    background:#0d1527;
    padding:15px;
    border-radius:22px;
}

.card-title{
    text-align:center;
    color:#ffd000;
    margin-bottom:15px;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.card-cell{
    aspect-ratio:1;
    background:#171f30;
    border:1px solid #2c3547;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#8390a6;
}

.card-cell.called{
    background:#ffd000;
    color:#111827;
}

.card-cell.free{
    background:#21b98b;
    color:white;
}


/* LIVE */

.live{
    text-align:center;
    margin-top:20px;
    color:#38d49c;
    font-weight:bold;
}

.live-dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#20c997;
    margin-right:6px;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        padding:20px 15px 100px;
    }

    .number-grid{
        grid-template-columns:repeat(5,1fr);
    }

    .number{
        height:50px;
    }

    .game-info{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .timer{
        text-align:left;
    }

    .timer-number{
        font-size:38px;
    }

    .jackpot{
        font-size:32px;
    }

    .account{
        padding:20px;
    }

    .balance{
        min-width:150px;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<div class="header">

    <div class="close">×</div>

    <div class="header-title">
        Hulu Bingo
    </div>

    <div class="header-icons">
       ⌄
        ⋮
    </div>

</div>


<!-- ACCOUNT -->

<div class="account">

    <div class="avatar">
        P
    </div>

    <div class="balances">

        <div class="balance">
            የማሸነፊያ ሂሳብ &nbsp; 0.00
        </div>

        <div class="balance">
            የጨዋታ ሂሳብ &nbsp; 5.00
        </div>

    </div>

</div>


<div class="container">


<!-- WAITING -->

<div class="waiting">

    <div class="waiting-title">
        የሚቀጥለው
    </div>

    <div class="waiting-text">
        ቲኬት ይምረጡ
    </div>

</div>


<!-- GAME PANEL -->

<div class="game-panel">

    <div class="game-info">

        <div>

            <div class="label">
                የዛሬ
            </div>

            <div class="jackpot">
                1024 ETB
            </div>

        </div>

        <div class="timer">

            <div class="timer-title">
                ጨዋታ ለመጀመር
            </div>

            <div class="timer-number" id="timer">
                00:50
            </div>

        </div>

    </div>

    <div class="called" id="calledBalls"></div>

</div>


<!-- NUMBER SELECTOR -->

<div class="selector">

    <div class="selector-header">

        <span>
            ቲኬት ይምረጡ (1 - 250)
        </span>

        <span class="selected-display" id="selectedNumber">
            —
        </span>

    </div>

    <div class="number-grid" id="numberGrid"></div>

</div>


<div class="status">

    <div class="status-text" id="statusText">
        ከ1 እስከ 250 ያለ ቲኬት ይምረጡ
    </div>

    <button
        class="start-button"
        id="startButton"
        disabled
        onclick="startGame()">

        ጨዋታ ጀምር

    </button>

</div>


<!-- BINGO CARD -->

<div class="bingo-card" id="bingoCard">

    <div class="card-title">
        YOUR BINGO CARD
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="live">
        <span class="live-dot"></span>
        LIVE GAME
    </div>

</div>


</div>


<script>


/* ==============================
   VARIABLES
============================== */

let selectedTicket = null;

let countdown = 50;

let gameStarted = false;

let timerInterval = null;

let callerInterval = null;

let calledNumbers = [];

let bingoNumbers = [];


/* ==============================
   CREATE 1-250 TICKETS
============================== */

const grid = document.getElementById("numberGrid");

for(let i = 1; i <= 250; i++){

    const number = document.createElement("div");

    number.className = "number";

    number.textContent = i;

    number.onclick = function(){

        if(gameStarted) return;

        selectTicket(i, number);

    };

    grid.appendChild(number);

}


/* ==============================
   SELECT TICKET
============================== */

function selectTicket(number, element){

    document
        .querySelectorAll(".number")
        .forEach(n => n.classList.remove("selected"));

    element.classList.add("selected");

    selectedTicket = number;

    document.getElementById("selectedNumber").textContent =
        number;

    document.getElementById("statusText").textContent =
        "ቲኬት " + number + " ተመርጧል — ጨዋታው በ50 ሰከንድ ይጀምራል";

    document.getElementById("startButton").disabled = false;

}


/* ==============================
   50 SECOND COUNTDOWN
============================== */

timerInterval = setInterval(function(){

    if(gameStarted) return;

    countdown--;

    let seconds =
        countdown.toString().padStart(2,"0");

    document.getElementById("timer").textContent =
        "00:" + seconds;


    /* NO TICKET YET */

    if(countdown <= 0){

        clearInterval(timerInterval);

        if(selectedTicket !== null){

            startGame();

        }else{

            countdown = 50;

            document.getElementById("timer").textContent =
                "00:50";

        }

    }

},1000);


/* ==============================
   START GAME
============================== */

function startGame(){

    if(gameStarted) return;

    if(selectedTicket === null){

        alert("Please select a ticket first.");

        return;

    }

    gameStarted = true;

    document.getElementById("startButton").disabled = true;

    document.getElementById("statusText").textContent =
        "🎉 GAME STARTED — NUMBERS ARE BEING CALLED AUTOMATICALLY";


    createBingoCard();

    document.getElementById("bingoCard").style.display =
        "block";


    /*
       Automatically call a number
       every 3 seconds.
    */

    callerInterval = setInterval(
        callNumber,
        3000
    );

}


/* ==============================
   CREATE BINGO CARD
============================== */

function createBingoCard(){

    bingoNumbers = [];

    for(let i = 1; i <= 75; i++){

        bingoNumbers.push(i);

    }

    shuffle(bingoNumbers);

    bingoNumbers =
        bingoNumbers.slice(0,25);

    const card =
        document.getElementById("cardGrid");

    card.innerHTML = "";

    bingoNumbers.forEach(function(number,index){

        const cell =
            document.createElement("div");

        cell.className = "card-cell";

        if(index === 12){

            cell.textContent = "FREE";

            cell.classList.add("free");

        }else{

            cell.textContent = number;

            cell.dataset.number = number;

        }

        card.appendChild(cell);

    });

}


/* ==============================
   CALL NUMBER
============================== */

function callNumber(){

    if(calledNumbers.length >= 75){

        clearInterval(callerInterval);

        document.getElementById("statusText").textContent =
            "GAME FINISHED";

        return;

    }


    let number;

    do{

        number =
            Math.floor(Math.random() * 75) + 1;

    }while(
        calledNumbers.includes(number)
    );


    calledNumbers.push(number);


    showCalledNumber(number);

    markCard(number);

}


/* ==============================
   SHOW CALLED NUMBER
============================== */

function showCalledNumber(number){

    const balls =
        document.getElementById("calledBalls");

    const ball =
        document.createElement("div");

    ball.className = "ball";

    ball.innerHTML =
        getLetter(number) +
        "<small>" +
        number +
        "</small>";

    balls.prepend(ball);


    /*
       Keep only the latest 10
       numbers on screen.
    */

    while(balls.children.length > 10){

        balls.removeChild(
            balls.lastChild
        );

    }

}


/* ==============================
   MARK CARD
============================== */

function markCard(number){

    const cells =
        document.querySelectorAll(".card-cell");

    cells.forEach(function(cell){

        if(
            Number(cell.dataset.number) === number
        ){

            cell.classList.add("called");

        }

    });

}


/* ==============================
   BINGO LETTER
============================== */

function getLetter(number){

    if(number <= 15)
        return "B";

    if(number <= 30)
        return "I";

    if(number <= 45)
        return "N";

    if(number <= 60)
        return "G";

    return "O";

}


/* ==============================
   SHUFFLE
============================== */

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}

</script>

</body>
</html>
