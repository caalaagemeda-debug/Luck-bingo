<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Bingo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#071426;
  --bg2:#0d1d35;
  --primary:#5967f2;
  --primary2:#7b86ff;
  --accent:#20d3a2;
  --accent2:#45e5bb;
  --white:#ffffff;
  --card:#f7f8fc;
  --line:#dce1ed;
  --ink:#182033;
  --muted:#6c7486;
  --red:#e05252;
  --locked:#a4a9b5;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(89,103,242,.35),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      var(--bg),
      var(--bg2)
    );

  font-family:'Fraunces',serif;
  color:white;
  padding:30px 12px 50px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* =========================
   HEADER
========================= */

.header{
  width:100%;
  max-width:700px;
  text-align:center;
  margin-bottom:22px;
}

.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,11vw,5rem);
  letter-spacing:.08em;
  color:var(--accent2);
  text-shadow:0 5px 20px rgba(0,0,0,.35);
  margin:0;
}

.subtitle{
  margin:5px 0 0;
  font-family:'Space Mono',monospace;
  font-size:.68rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
}

/* =========================
   SCREENS
========================= */

.screen{
  width:100%;
  max-width:700px;
  display:none;
  flex-direction:column;
  align-items:center;
}

.screen.active{
  display:flex;
}

/* =========================
   PANEL
========================= */

.panel{
  width:100%;
  background:var(--card);
  color:var(--ink);
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.28);
}

.panel-title{
  font-family:'Bebas Neue',sans-serif;
  text-align:center;
  font-size:1.8rem;
  letter-spacing:.1em;
  color:var(--primary);
  margin-bottom:18px;
}

/* =========================
   ROOM LIST
========================= */

.room-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.room-card{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;

  background:white;
  border:2px solid transparent;
  border-radius:16px;

  padding:18px;

  cursor:pointer;

  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;

  box-shadow:0 6px 18px rgba(0,0,0,.10);
}

.room-card:hover{
  border-color:var(--primary);
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(0,0,0,.16);
}

.room-card:active{
  transform:scale(.98);
}

.room-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.45rem;
  letter-spacing:.07em;
  color:var(--ink);
}

.room-meta{
  margin-top:5px;
  font-family:'Space Mono',monospace;
  font-size:.65rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
}

.room-price{
  min-width:90px;
  text-align:center;
  background:var(--primary);
  color:white;
  border-radius:12px;
  padding:10px 12px;
}

.room-price .amount{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.5rem;
  letter-spacing:.05em;
}

.room-price .label{
  font-family:'Space Mono',monospace;
  font-size:.55rem;
  opacity:.8;
}

/* =========================
   SELECT HEADER
========================= */

.room-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;

  font-family:'Space Mono',monospace;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.06em;

  color:rgba(255,255,255,.7);
}

.room-timer{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;
  color:var(--accent2);
}

.room-stats{
  width:100%;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;

  margin-bottom:14px;

  font-family:'Space Mono',monospace;
  font-size:.65rem;
  text-transform:uppercase;

  color:rgba(255,255,255,.65);
}

.room-stats b{
  color:var(--accent2);
}

/* =========================
   CARD SELECT
========================= */

.search-row{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}

.search-row input{
  width:170px;
  padding:10px 12px;

  border:1px solid var(--line);
  border-radius:10px;

  text-align:center;

  font-family:'Space Mono',monospace;
  font-size:.8rem;

  background:white;
  color:var(--ink);
}

.num-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;

  max-height:390px;
  overflow-y:auto;

  padding:3px;
}

.num-btn{
  min-height:45px;

  border:1px solid var(--line);
  border-radius:9px;

  background:white;
  color:var(--ink);

  font-family:'Space Mono',monospace;
  font-weight:700;

  cursor:pointer;

  transition:.12s;
}

.num-btn:hover{
  border-color:var(--primary);
  transform:translateY(-1px);
}

.num-btn.selected{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.num-btn.locked{
  background:var(--locked);
  color:white;
  border-color:var(--locked);
  opacity:.65;
  cursor:not-allowed;
}

.pick-status{
  margin-top:13px;

  text-align:center;

  font-family:'Space Mono',monospace;
  font-size:.68rem;

  color:var(--muted);
}

/* =========================
   GAME
========================= */

.stage{
  width:100%;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  gap:25px;
  flex-wrap:wrap;
}

.caller-panel{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;

  min-width:190px;
}

.ball-well{
  width:145px;
  height:145px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #294a78,
      #081529 70%
    );

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
    inset 0 0 25px rgba(0,0,0,.65),
    0 0 0 4px var(--accent);
}

.ball{
  width:105px;
  height:105px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #edf0f8 60%,
      #ccd2df
    );

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  box-shadow:
    0 8px 20px rgba(0,0,0,.4),
    inset 0 -6px 10px rgba(0,0,0,.1);
}

.ball.pop{
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
}

@keyframes popIn{
  0%{
    transform:scale(.2) rotate(-25deg);
    opacity:0;
  }

  60%{
    transform:scale(1.12) rotate(6deg);
    opacity:1;
  }

  100%{
    transform:scale(1) rotate(0);
  }
}

.ball .letter{
  font-family:'Bebas Neue',sans-serif;
  font-size:1rem;
  color:var(--primary);
}

.ball .num{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.5rem;
  line-height:1;
  color:var(--ink);
}

.next-in{
  font-family:'Space Mono',monospace;
  font-size:.65rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:rgba(255,255,255,.55);
}

.pause-btn{
  background:var(--accent);
  color:#06251d;

  border:0;
  border-radius:9px;

  padding:9px 20px;

  font-family:'Bebas Neue',sans-serif;
  font-size:1rem;
  letter-spacing:.05em;

  cursor:pointer;
}

.called-log{
  max-width:230px;

  min-height:40px;

  text-align:center;

  font-family:'Space Mono',monospace;
  font-size:.63rem;
  line-height:1.6;

  color:rgba(255,255,255,.55);
}

/* =========================
   BINGO CARD
========================= */

.card-wrap{
  background:var(--card);
  padding:15px;

  border-radius:16px;

  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.card-title{
  text-align:center;

  font-family:'Bebas Neue',sans-serif;
  font-size:1.8rem;

  letter-spacing:.2em;

  color:var(--primary);
}

.card-number{
  text-align:center;

  margin-bottom:8px;

  font-family:'Space Mono',monospace;
  font-size:.6rem;

  color:var(--muted);
}

.grid{
  display:grid;

  grid-template-columns:repeat(5,52px);
  grid-template-rows:repeat(5,52px);

  gap:6px;
}

.cell{
  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  background:white;

  border:1px solid var(--line);
  border-radius:7px;

  color:var(--ink);

  font-family:'Space Mono',monospace;
  font-size:.9rem;
  font-weight:700;

  user-select:none;
}

.cell.free{
  color:var(--primary);
  background:#eef0ff;

  font-family:'Bebas Neue',sans-serif;
  font-size:.7rem;
}

.cell.marked::after{
  content:'';

  position:absolute;
  inset:5px;

  border-radius:50%;

  background:var(--primary);

  opacity:.9;

  box-shadow:
    inset 0 -3px 4px rgba(0,0,0,.25);
}

.cell.marked{
  color:white;
}

.cell span{
  position:relative;
  z-index:2;
}

.cell.win-cell::after{
  background:var(--accent);

  box-shadow:
    0 0 12px var(--accent2);
}

.status{
  margin-top:10px;

  text-align:center;

  font-family:'Space Mono',monospace;
  font-size:.65rem;

  color:var(--muted);
}

.win-banner{
  display:none;

  margin-top:10px;

  text-align:center;

  font-family:'Bebas Neue',sans-serif;
  font-size:1.7rem;

  letter-spacing:.1em;

  color:var(--accent);
}

.win-banner.show{
  display:block;
  animation:popIn .4s ease;
}

.link-btn{
  margin-top:14px;

  background:transparent;

  border:1px solid rgba(255,255,255,.3);

  color:rgba(255,255,255,.7);

  padding:9px 17px;

  border-radius:8px;

  font-family:'Space Mono',monospace;
  font-size:.65rem;

  cursor:pointer;
}

.link-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  body{
    padding:20px 10px 40px;
  }

  .logo{
    font-size:3.5rem;
  }

  .panel{
    padding:14px;
  }

  .room-card{
    padding:14px;
  }

  .room-name{
    font-size:1.25rem;
  }

  .room-price{
    min-width:75px;
  }

  .room-price .amount{
    font-size:1.2rem;
  }

  .num-grid{
    grid-template-columns:repeat(5,1fr);
  }

  .num-btn{
    min-height:43px;
    font-size:.72rem;
  }

  .grid{
    grid-template-columns:repeat(5,17vw);
    grid-template-rows:repeat(5,17vw);
    gap:5px;
  }

  .cell{
    font-size:.72rem;
  }

  .ball-well{
    width:125px;
    height:125px;
  }

  .ball{
    width:92px;
    height:92px;
  }

  .ball .num{
    font-size:2.1rem;
  }

  .stage{
    gap:18px;
  }
}

@media(prefers-reduced-motion:reduce){
  .ball.pop,
  .win-banner.show{
    animation:none;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">
  <h1 class="logo">LUCKY BINGO</h1>
  <p class="subtitle">
    Rooms · Live Cards · Automatic Caller
  </p>
</div>


<!-- =========================
     ROOM SCREEN
========================= -->

<div class="screen active" id="screenRooms">

  <div class="panel">

    <div class="panel-title">
      OPEN ROOMS
    </div>

    <div class="room-list" id="roomList"></div>

  </div>

</div>


<!-- =========================
     CARD SELECT SCREEN
========================= -->

<div class="screen" id="screenSelect">

  <div class="room-header">

    <span id="roomLabel">
      Room
    </span>

    <span class="room-timer" id="selectTimer">
      50
    </span>

  </div>


  <div class="room-stats">

    <span>
      Players:
      <b id="playerCount">Unlimited</b>
    </span>

    <span>
      Entry:
      <b id="entryAmt">0 ETB</b>
    </span>

  </div>


  <div class="panel">

    <div class="panel-title">
      PICK YOUR CARD
    </div>

    <div class="search-row">

      <input
        type="number"
        id="searchNum"
        min="1"
        max="250"
        placeholder="Card 1 - 250"
      >

    </div>

    <div
      class="num-grid"
      id="numGrid"
    ></div>

    <div
      class="pick-status"
      id="pickStatus"
    >
      Choose a card before the countdown ends.
    </div>

  </div>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div class="screen" id="screenGame">

  <div class="room-stats">

    <span>
      Room:
      <b id="gameRoomLabel">—</b>
    </span>

    <span>
      Players:
      <b>Unlimited</b>
    </span>

  </div>


  <div class="stage">

    <!-- CALLER -->

    <div class="caller-panel">

      <div class="ball-well">

        <div class="ball" id="ball">

          <div
            class="letter"
            id="ballLetter"
          >
            —
          </div>

          <div
            class="num"
            id="ballNum"
          >
            ?
          </div>

        </div>

      </div>


      <div
        class="next-in"
        id="nextIn"
      >
        Next call in 4s
      </div>


      <button
        class="pause-btn"
        id="pauseBtn"
      >
        Pause
      </button>


      <div
        class="called-log"
        id="calledLog"
      >
        No numbers called yet.
      </div>

    </div>


    <!-- CARD -->

    <div>

      <div class="card-wrap">

        <div class="card-title">
          B I N G O
        </div>

        <div
          class="card-number"
          id="cardNumberLabel"
        >
          Card #—
        </div>

        <div
          class="grid"
          id="grid"
        ></div>

        <div
          class="status"
          id="status"
        >
          Waiting for first call…
        </div>

        <div
          class="win-banner"
          id="winBanner"
        >
          BINGO!
        </div>

      </div>


      <div style="text-align:center;">

        <button
          class="link-btn"
          id="newCardBtn"
        >
          Back to rooms
        </button>

      </div>

    </div>

  </div>

</div>


<script>

(function(){

  /* =========================
     BINGO SETTINGS
  ========================= */

  const COLS = {
    B:[1,15],
    I:[16,30],
    N:[31,45],
    G:[46,60],
    O:[61,75]
  };

  const LETTERS = [
    'B',
    'I',
    'N',
    'G',
    'O'
  ];

  const SELECT_SECONDS = 50;

  const CALL_INTERVAL_MS = 4000;


  /* =========================
     ONLY TWO ROOMS
  ========================= */

  const ROOMS = [

    {
      id:'r1',
      name:'20 ETB PLAY',
      entry:20
    },

    {
      id:'r2',
      name:'40 ETB PLAY',
      entry:40
    }

  ];


  /* =========================
     GAME STATE
  ========================= */

  let currentRoom = null;

  let roomPlayers = 0;

  let lockedNumbers = new Set();

  let myCardNumber = null;

  let card = [];

  let called = [];

  let remaining = [];

  let won = false;

  let paused = false;

  let selectTimer = null;

  let callTimer = null;

  let nextInTimer = null;

  let msUntilNextCall = CALL_INTERVAL_MS;


  /* =========================
     DOM
  ========================= */

  const screenRooms =
    document.getElementById('screenRooms');

  const screenSelect =
    document.getElementById('screenSelect');

  const screenGame =
    document.getElementById('screenGame');

  const roomList =
    document.getElementById('roomList');

  const roomLabel =
    document.getElementById('roomLabel');

  const selectTimerEl =
    document.getElementById('selectTimer');

  const playerCountEl =
    document.getElementById('playerCount');

  const entryAmtEl =
    document.getElementById('entryAmt');

  const numGrid =
    document.getElementById('numGrid');

  const searchNum =
    document.getElementById('searchNum');

  const pickStatus =
    document.getElementById('pickStatus');

  const grid =
    document.getElementById('grid');

  const ball =
    document.getElementById('ball');

  const ballLetter =
    document.getElementById('ballLetter');

  const ballNum =
    document.getElementById('ballNum');

  const nextInEl =
    document.getElementById('nextIn');

  const pauseBtn =
    document.getElementById('pauseBtn');

  const calledLog =
    document.getElementById('calledLog');

  const statusEl =
    document.getElementById('status');

  const winBanner =
    document.getElementById('winBanner');

  const newCardBtn =
    document.getElementById('newCardBtn');

  const cardNumberLabel =
    document.getElementById('cardNumberLabel');

  const gameRoomLabel =
    document.getElementById('gameRoomLabel');


  /* =========================
     SCREEN CONTROL
  ========================= */

  function showScreen(el){

    [
      screenRooms,
      screenSelect,
      screenGame
    ].forEach(s =>
      s.classList.remove('active')
    );

    el.classList.add('active');
  }


  /* =========================
     RANDOM
  ========================= */

  function shuffle(arr){

    for(
      let i = arr.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        arr[i],
        arr[j]
      ] = [
        arr[j],
        arr[i]
      ];

    }

    return arr;
  }


  function mulberry32(seed){

    return function(){

      seed |= 0;

      seed =
        (seed + 0x6D2B79F5) | 0;

      let t =
        Math.imul(
          seed ^ (seed >>> 15),
          1 | seed
        );

      t =
        (t +
          Math.imul(
            t ^ (t >>> 7),
            61 | t
          )
        ) ^ t;

      return (
        (t ^ (t >>> 14)) >>> 0
      ) / 4294967296;

    };

  }


  function shuffleWith(arr,rng){

    for(
      let i=arr.length-1;
      i>0;
      i--
    ){

      const j =
        Math.floor(
          rng() * (i+1)
        );

      [
        arr[i],
        arr[j]
      ] = [
        arr[j],
        arr[i]
      ];

    }

    return arr;
  }


  function letterFor(num){

    for(
      const l of LETTERS
    ){

      if(
        num >= COLS[l][0] &&
        num <= COLS[l][1]
      ){

        return l;

      }

    }

    return '';

  }


  /* =========================
     ROOMS
  ========================= */

  function renderRooms(){

    roomList.innerHTML = '';

    ROOMS.forEach(room => {

      const div =
        document.createElement('div');

      div.className =
        'room-card';

      div.innerHTML = `

        <div>

          <div class="room-name">
            ${room.name}
          </div>

          <div class="room-meta">
            Unlimited players
          </div>

        </div>

        <div class="room-price">

          <div class="amount">
            ${room.entry} ETB
          </div>

          <div class="label">
            PLAY
          </div>

        </div>

      `;

      div.addEventListener(
        'click',
        () => joinRoom(room)
      );

      roomList.appendChild(div);

    });

  }


  /* =========================
     JOIN ROOM
  ========================= */

  function joinRoom(room){

    currentRoom = room;

    roomPlayers = 1;

    lockedNumbers =
      new Set();

    myCardNumber = null;

    card = [];

    roomLabel.textContent =
      room.name;

    entryAmtEl.textContent =
      room.entry + ' ETB';

    playerCountEl.textContent =
      'Unlimited';

    buildPicker();

    showScreen(screenSelect);

    startSelectPhase();

  }


  /* =========================
     BINGO CARD
  ========================= */

  function buildCardFor(number){

    const rng =
      mulberry32(
        number * 2654435761
      );

    const result = [];

    for(
      let col=0;
      col<5;
      col++
    ){

      const [lo,hi] =
        COLS[LETTERS[col]];

      const pool = [];

      for(
        let n=lo;
        n<=hi;
        n++
      ){

        pool.push(n);

      }

      shuffleWith(pool,rng);

      const picks =
        pool.slice(0,5);

      for(
        let row=0;
        row<5;
        row++
      ){

        if(!result[row])
          result[row]=[];

        const isFree =
          row===2 && col===2;

        result[row][col] = {

          num:
            isFree
              ? null
              : picks[row],

          marked:isFree,

          free:isFree

        };

      }

    }

    return result;

  }


  /* =========================
     CARD PICKER
  ========================= */

  function buildPicker(){

    numGrid.innerHTML='';

    for(
      let n=1;
      n<=250;
      n++
    ){

      const btn =
        document.createElement('button');

      btn.className =
        'num-btn';

      btn.textContent=n;

      btn.dataset.num=n;

      btn.addEventListener(
        'click',
        () => pickNumber(n,btn)
      );

      numGrid.appendChild(btn);

    }

  }


  searchNum.addEventListener(
    'input',
    () => {

      const val =
        parseInt(
          searchNum.value,
          10
        );

      if(
        val>=1 &&
        val<=250
      ){

        const btn =
          numGrid.children[val-1];

        if(btn){

          btn.scrollIntoView({
            block:'center',
            behavior:'smooth'
          });

        }

      }

    }
  );


  function pickNumber(n,btn){

    if(
      lockedNumbers.has(n)
    ){

      return;

    }


    if(
      myCardNumber !== null
    ){

      const previous =
        numGrid.children[
          myCardNumber - 1
        ];

      if(previous){

        previous.classList.remove(
          'selected'
        );

      }

      lockedNumbers.delete(
        myCardNumber
      );

    }


    myCardNumber=n;

    lockedNumbers.add(n);

    btn.classList.add(
      'selected'
    );

    card =
      buildCardFor(n);

    pickStatus.textContent =
      'Card #' +
      n +
      ' selected.';

  }


  /* =========================
     50 SECOND COUNTDOWN
  ========================= */

  function startSelectPhase(){

    clearInterval(selectTimer);

    let secondsLeft =
      SELECT_SECONDS;

    selectTimerEl.textContent =
      secondsLeft;


    selectTimer =
      setInterval(() => {

        secondsLeft--;

        selectTimerEl.textContent =
          Math.max(
            secondsLeft,
            0
          );


        if(
          secondsLeft<=0
        ){

          clearInterval(
            selectTimer
          );

          finalizeCardAndStart();

        }

      },1000);

  }


  function finalizeCardAndStart(){

    if(
      myCardNumber===null
    ){

      const available=[];

      for(
        let n=1;
        n<=250;
        n++
      ){

        if(
          !lockedNumbers.has(n)
        ){

          available.push(n);

        }

      }


      const pick =
        available.length
          ? available[
              Math.floor(
                Math.random() *
                available.length
              )
            ]
          : Math.floor(
              Math.random()*250
            )+1;


      myCardNumber=pick;

      card =
        buildCardFor(pick);

    }


    startGame();

  }


  /* =========================
     GAME
  ========================= */

  function renderCard(){

    grid.innerHTML='';


    for(
      let row=0;
      row<5;
      row++
    ){

      for(
        let col=0;
        col<5;
        col++
      ){

        const data =
          card[row][col];

        const div =
          document.createElement('div');

        div.className =
          'cell' +

          (
            data.free
              ? ' free'
              : ''
          ) +

          (
            data.marked
              ? ' marked'
              : ''
          );


        const span =
          document.createElement('span');

        span.textContent =
          data.free
            ? 'FREE'
            : data.num;

        div.appendChild(span);

        grid.appendChild(div);

      }

    }

  }


  function updateCalledLog(){

    if(
      called.length===0
    ){

      calledLog.textContent =
        'No numbers called yet.';

      return;

    }


    const recent =
      called
        .slice(-8)
        .map(
          n =>
            letterFor(n)+n
        )
        .join('   ');


    calledLog.textContent =
      called.length +
      ' called  |  ' +
      recent;

  }


  function startGame(){

    won=false;

    paused=false;

    called=[];

    remaining =
      shuffle(
        Array.from(
          {length:75},
          (_,i)=>i+1
        )
      );


    winBanner.classList.remove(
      'show'
    );


    pauseBtn.textContent =
      'Pause';


    cardNumberLabel.textContent =
      'Card #' +
      myCardNumber;


    gameRoomLabel.textContent =
      currentRoom.name;


    renderCard();

    updateCalledLog();


    statusEl.textContent =
      'Calling first number…';


    showScreen(screenGame);


    msUntilNextCall=1200;

    scheduleNextCall();

  }


  /* =========================
     AUTOMATIC CALLER
  ========================= */

  function scheduleNextCall(){

    clearTimeout(callTimer);

    clearInterval(nextInTimer);


    if(
      won ||
      paused ||
      remaining.length===0
    ){

      return;

    }


    let secsLeft =
      Math.ceil(
        msUntilNextCall/1000
      );


    nextInEl.textContent =
      'Next call in ' +
      secsLeft +
      's';


    nextInTimer =
      setInterval(() => {

        secsLeft--;

        if(
          secsLeft>0
        ){

          nextInEl.textContent =
            'Next call in ' +
            secsLeft +
            's';

        }

      },1000);


    callTimer =
      setTimeout(() => {

        clearInterval(
          nextInTimer
        );

        callNext();

        msUntilNextCall =
          CALL_INTERVAL_MS;

        scheduleNextCall();

      },msUntilNextCall);

  }


  function callNext(){

    if(
      won ||
      remaining.length===0
    ){

      return;

    }


    const num =
      remaining.pop();

    called.push(num);


    const letter =
      letterFor(num);


    ball.classList.remove(
      'pop'
    );

    void ball.offsetWidth;


    ballLetter.textContent =
      letter;

    ballNum.textContent =
      num;


    ball.classList.add(
      'pop'
    );


    for(
      let row=0;
      row<5;
      row++
    ){

      for(
        let col=0;
        col<5;
        col++
      ){

        if(
          card[row][col].num===num
        ){

          card[row][col].marked=true;

        }

      }

    }


    renderCard();

    updateCalledLog();


    statusEl.textContent =
      (75-remaining.length) +
      ' of 75 called';


    checkWin();


    if(
      remaining.length===0
    ){

      nextInEl.textContent =
        'All numbers called';

    }

  }


  /* =========================
     WIN CHECK
  ========================= */

  function checkWin(){

    const lines=[];


    for(
      let r=0;
      r<5;
      r++
    ){

      lines.push([
        [r,0],
        [r,1],
        [r,2],
        [r,3],
        [r,4]
      ]);

    }


    for(
      let c=0;
      c<5;
      c++
    ){

      lines.push([
        [0,c],
        [1,c],
        [2,c],
        [3,c],
        [4,c]
      ]);

    }


    lines.push([
      [0,0],
      [1,1],
      [2,2],
      [3,3],
      [4,4]
    ]);


    lines.push([
      [0,4],
      [1,3],
      [2,2],
      [3,1],
      [4,0]
    ]);


    for(
      const line of lines
    ){

      if(
        line.every(
          ([r,c]) =>
            card[r][c].marked
        )
      ){

        declareWin(line);

        return;

      }

    }

  }


  function declareWin(line){

    won=true;


    clearTimeout(callTimer);

    clearInterval(nextInTimer);


    nextInEl.textContent =
      'Game over';


    winBanner.classList.add(
      'show'
    );


    statusEl.textContent =
      'BINGO! ' +
      called.length +
      ' numbers called.';


    line.forEach(
      ([r,c]) => {

        const cell =
          grid.children[
            r*5+c
          ];

        if(cell){

          cell.classList.add(
            'win-cell'
          );

        }

      }
    );

  }


  /* =========================
     PAUSE
  ========================= */

  pauseBtn.addEventListener(
    'click',
    () => {

      if(won)
        return;


      paused=!paused;


      if(paused){

        pauseBtn.textContent =
          'Resume';

        clearTimeout(
          callTimer
        );

        clearInterval(
          nextInTimer
        );

        nextInEl.textContent =
          'Paused';

      }else{

        pauseBtn.textContent =
          'Pause';

        msUntilNextCall =
          CALL_INTERVAL_MS;

        scheduleNextCall();

      }

    }
  );


  /* =========================
     BACK TO ROOMS
  ========================= */

  newCardBtn.addEventListener(
    'click',
    () => {

      clearTimeout(callTimer);

      clearInterval(nextInTimer);

      clearInterval(selectTimer);

      renderRooms();

      showScreen(screenRooms);

    }
  );


  /* =========================
     START
  ========================= */

  renderRooms();

})();

</script>

</body>
