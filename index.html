<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>lucy bingo</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0d172b;
    color: #ffffff;
}

body {
    overflow-x: hidden;
}

/* Telegram top bar */

.telegram-bar {
    height: 64px;
    background: #172231;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 18px;
}

.close {
    font-size: 38px;
    font-weight: 200;
    line-height: 1;
}

.bot-title {
    font-size: 28px;
    font-weight: 600;
    flex: 1;
}

.arrow {
    font-size: 34px;
    transform: rotate(45deg);
}

.menu {
    font-size: 30px;
    letter-spacing: 3px;
}

/* Main */

.app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 30px 60px;
}

/* Top information */

.info-box {
    border: 3px solid #16833e;
    border-radius: 34px;
    background: #1d1646;
    min-height: 138px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 10px;
    padding: 20px 18px;
}

.info-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
}

.info-icon {
    font-size: 34px;
}

.players {
    background: #ffffff;
    color: #237343;
    border-radius: 30px;
    padding: 13px 22px;
}

.money {
    color: #f5df00;
}

.wallet {
    color: #f5df00;
}

/* Starting */

.status {
    width: fit-content;
    margin: 16px auto 14px;
    background: #ffffff;
    color: #08772b;
    border-radius: 9px;
    padding: 4px 14px;
    font-size: 28px;
    font-weight: 500;
}

/* Bingo board */

.board {
    border: 3px solid #16833e;
    border-radius: 32px;
    background: #170a3d;
    padding: 14px 8px 8px;
    overflow: hidden;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
}

.number {
    height: 82px;
    border: 0;
    border-radius: 9px;
    background: #b8b8c6;
    color: #202333;
    font-size: 24px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s, background 0.2s;
}

.number:active {
    transform: scale(0.96);
}

.number.drawn {
    background: #2fa85b;
    color: white;
    font-weight: bold;
}

.number.current {
    background: #ffd900;
    color: #171717;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(255, 217, 0, 0.7);
}

/* Bottom area */

.game-info {
    text-align: center;
    margin-top: 22px;
    color: #aaa;
    font-size: 18px;
}

.current-number {
    font-size: 64px;
    font-weight: bold;
    margin: 8px 0;
    color: white;
}

.draw-button {
    width: 100%;
    margin-top: 20px;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: #16833e;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.draw-button:active {
    transform: scale(0.98);
}

/* Small screens */

@media (max-width: 600px) {

    .telegram-bar {
        height: 64px;
        padding: 0 16px;
        gap: 15px;
    }

    .close {
        font-size: 35px;
    }

    .bot-title {
        font-size: 27px;
    }

    .arrow {
        font-size: 30px;
    }

    .menu {
        font-size: 26px;
    }

    .app {
        padding: 30px 30px 50px;
    }

    .info-box {
        min-height: 138px;
        border-radius: 34px;
        padding: 18px 10px;
    }

    .info-item {
        font-size: 22px;
        gap: 6px;
    }

    .info-icon {
        font-size: 29px;
    }

    .players {
        padding: 12px 16px;
    }

    .status {
        font-size: 27px;
        margin-top: 16px;
        margin-bottom: 14px;
    }

    .board {
        padding: 14px 8px 8px;
        border-radius: 30px;
    }

    .numbers {
        gap: 12px;
    }

    .number {
        height: 82px;
        font-size: 23px;
    }
}

@media (max-width: 430px) {

    .app {
        padding-left: 30px;
        padding-right: 30px;
    }

    .info-item {
        font-size: 20px;
    }

    .players {
        padding: 11px 13px;
    }

    .number {
        height: 76px;
        font-size: 21px;
    }

    .numbers {
        gap: 10px;
    }
}
</style>
</head>

<body>

<!-- Telegram-style header -->

<div class="telegram-bar">
    <div class="close">×</div>
    <div class="bot-title">Oli Bingo</div>
    <div class="arrow">⌄</div>
    <div class="menu">⋮</div>
</div>


<div class="app">

    <!-- Top information -->

    <div class="info-box">

        <div class="info-item players">
            <span class="info-icon">👥</span>
            <span id="players">2</span>
            <span>💵</span>
            <span id="balance">32 Br</span>
        </div>

        <div class="info-item money">
            <span class="info-icon">💵</span>
            <span id="prize">20 Br</span>
        </div>

        <div class="info-item wallet">
            <span class="info-icon">👛</span>
            <span id="wallet">0 Br</span>
        </div>

    </div>


    <!-- Status -->

    <div class="status" id="status">
        Starting...
    </div>


    <!-- Bingo board -->

    <div class="board">

        <div class="numbers" id="numbers"></div>

    </div>


    <!-- Game information -->

    <div class="game-info">

        <div>Next number</div>

        <div class="current-number" id="currentNumber">
            —
        </div>

        <div id="countdown">
            Waiting
        </div>

        <button class="draw-button" id="drawButton">
            DRAW NUMBER
        </button>

    </div>

</div>


<script>

/* -----------------------------
   GAME SETTINGS
----------------------------- */

const DRAW_TIME = 50;

let numbers = [];
let drawnNumbers = [];
let currentNumber = null;
let countdown = DRAW_TIME;
let timer = null;


/* -----------------------------
   CREATE BINGO NUMBERS
----------------------------- */

function createNumbers() {

    const container = document.getElementById("numbers");

    container.innerHTML = "";

    /*
       The screenshot uses rows like:

       1  2  3  4  5  6
       9 10 11 12 13 14
       17 18 19 20 21 22

       So every 8-number group displays
       the first 6 numbers.
    */

    numbers = [];

    for (let start = 1; start <= 90; start += 8) {

        for (let i = 0; i < 6; i++) {

            const value = start + i;

            if (value <= 90) {

                numbers.push(value);

                const button = document.createElement("div");

                button.className = "number";
                button.dataset.number = value;
                button.textContent = value;

                button.addEventListener("click", function() {
                    toggleNumber(value);
                });

                container.appendChild(button);
            }
        }
    }
}


/* -----------------------------
   MARK NUMBER
----------------------------- */

function toggleNumber(number) {

    const element =
        document.querySelector(
            `.number[data-number="${number}"]`
        );

    if (!element) return;

    if (drawnNumbers.includes(number)) {

        drawnNumbers =
            drawnNumbers.filter(n => n !== number);

        element.classList.remove("drawn");

    } else {

        drawnNumbers.push(number);

        element.classList.add("drawn");
    }
}


/* -----------------------------
   RANDOM DRAW
----------------------------- */

function drawNumber() {

    const available =
        numbers.filter(
            n => !drawnNumbers.includes(n)
        );

    if (available.length === 0) {

        document.getElementById("status")
            .textContent = "Game Finished";

        clearInterval(timer);

        return;
    }

    const randomIndex =
        Math.floor(Math.random() * available.length);

    const number =
        available[randomIndex];

    currentNumber = number;

    drawnNumbers.push(number);

    const element =
        document.querySelector(
            `.number[data-number="${number}"]`
        );

    if (element) {

        element.classList.add("current");

        setTimeout(() => {
            element.classList.remove("current");
            element.classList.add("drawn");
        }, 1000);
    }

    document.getElementById("currentNumber")
        .textContent = number;

    document.getElementById("status")
        .textContent = "Number Drawn";

    countdown = DRAW_TIME;

    document.getElementById("countdown")
        .textContent =
        "Next number in " + countdown + " seconds";
}


/* -----------------------------
   COUNTDOWN
----------------------------- */

function startCountdown() {

    clearInterval(timer);

    countdown = DRAW_TIME;

    document.getElementById("status")
        .textContent = "Starting...";

    timer = setInterval(() => {

        countdown--;

        document.getElementById("countdown")
            .textContent =
            "Next number in " +
            countdown +
            " seconds";

        if (countdown <= 0) {

            drawNumber();
        }

    }, 1000);
}


/* -----------------------------
   MANUAL DRAW BUTTON
----------------------------- */

document
    .getElementById("drawButton")
    .addEventListener("click", function() {

        drawNumber();

    });


/* -----------------------------
   START GAME
----------------------------- */

createNumbers();

setTimeout(() => {

    document.getElementById("status")
        .textContent = "Starting...";

    startCountdown();

}, 1000);

</script>

</body>
</html>
