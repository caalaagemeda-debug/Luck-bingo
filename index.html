<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulu Bingo Clone</title>
    <style>
        :root {
            --bg-dark: #121418;
            --card-bg: #1e222d;
            --accent-yellow: #f1b80c;
            --accent-green: #00d26a;
            --text-light: #ffffff;
            --text-muted: #8e94a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: #161920;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #2a2f3d;
        }

        .title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .balance-badge {
            background: #282d3c;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-yellow);
        }

        /* Game Board Display */
        .game-status {
            padding: 16px;
            text-align: center;
        }

        .prize-pool {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-yellow);
            margin: 10px 0;
        }

        .timer-display {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Ball Caller Display */
        .ball-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            min-height: 60px;
        }

        .bingo-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* Bingo Card Matrix */
        .bingo-card {
            background-color: var(--card-bg);
            margin: 0 16px;
            padding: 12px;
            border-radius: 12px;
        }

        .card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-weight: bold;
            color: var(--accent-yellow);
            margin-bottom: 8px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background-color: #2a2f3d;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }

        .grid-cell.marked {
            background-color: var(--accent-green);
            color: #000;
        }

        .grid-cell.free {
            background-color: var(--accent-yellow);
            color: #000;
        }

        /* Footer Controls */
        .footer {
            margin-top: auto;
            padding: 16px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-bingo {
            background-color: var(--accent-yellow);
            color: #000;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="title">Hulu Bingo Clone</div>
        <div class="balance-badge">Balance: <span id="balance">100.00</span> ETB</div>
    </div>

    <div class="game-status">
        <div>PRIZE POOL</div>
        <div class="prize-pool" id="prize-pool">1672 ETB</div>
        <div class="timer-display" id="timer">Round starts in: 00:05</div>
        
        <div class="ball-display" id="ball-display">
            <div class="bingo-ball" id="current-ball">-</div>
        </div>
    </div>

    <div class="bingo-card">
        <div class="card-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="card-grid" id="card-grid"></div>
    </div>

    <div class="footer">
        <button class="btn btn-bingo" onclick="checkBingo()">BINGO!</button>
    </div>
</div>

<script>
    const sampleNumbers = [
        [2, 13, 10, 4, 5],
        [28, 21, 25, 30, 23],
        [31, 43, '★', 34, 41],
        [51, 53, 57, 49, 46],
        [75, 74, 68, 71, 69]
    ];

    function createBoard() {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                const val = sampleNumbers[col][row];
                cell.innerText = val;
                
                if (val === '★') {
                    cell.classList.add('free');
                } else {
                    cell.onclick = () => cell.classList.toggle('marked');
                }
                grid.appendChild(cell);
            }
        }
    }

    let timeLeft = 5;
    const timerElem = document.getElementById('timer');
    const ballElem = document.getElementById('current-ball');

    function startTimer() {
        const interval = setInterval(() => {
            timeLeft--;
            timerElem.innerText = `Round starts in: 00:0${timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(interval);
                timerElem.innerText = "GAME IN PROGRESS";
                startGame();
            }
        }, 1000);
    }

    function startGame() {
        const calledNumbers = [61, 4, 29, 12, 5, 49, 10, 30, 46, 57];
        let index = 0;
        
        const callInterval = setInterval(() => {
            if (index < calledNumbers.length) {
                ballElem.innerText = calledNumbers[index];
                index++;
            } else {
                clearInterval(callInterval);
            }
        }, 2000);
    }

    function checkBingo() {
        alert("Bingo claimed! Verifying ticket...");
    }

    createBoard();
    startTimer();
</script>
</body>
</html>
